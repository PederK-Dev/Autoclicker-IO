name: Windows validation and release artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Non-injecting tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q autoclicker main.py tests

      - name: Run hosted-runner-safe tests
        shell: pwsh
        run: |
          # The live test deliberately injects real mouse input and is never
          # run in CI. The UI smoke test needs an interactive desktop, so it
          # remains a documented local check as well.
          $tests = @(
            "tests/test_core.py",
            "tests/test_hardening.py",
            "tests/test_mouse_hotkeys.py",
            "tests/test_widget_accessibility.py"
          )
          foreach ($test in $tests) {
            if (-not (Test-Path -LiteralPath $test -PathType Leaf)) {
              throw "Expected non-injecting test is missing: $test"
            }
            Write-Host "Running $test"
            python $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed" }
          }

  package:
    name: Validate source and package metadata
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package builder
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input build

      - name: Build wheel and sdist
        shell: pwsh
        run: python -m build --sdist --wheel --outdir package-dist

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-io-python-packages
          path: package-dist/*
          if-no-files-found: error

  windows-executable:
    name: Build Windows executable (once)
    runs-on: windows-latest
    needs: [tests, package]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install optional PyInstaller tooling
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-input ".[build]"

      - name: Build versioned executable
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-io-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
